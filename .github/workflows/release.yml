name: release

# Publishing is credential-free: PyPI trusts this repository + this workflow
# file + the `pypi` environment via OIDC (Trusted Publishing), so there is no
# API token stored anywhere. The publisher registration on PyPI names
# `release.yml` explicitly — renaming this file breaks publishing until the
# registration is updated to match.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # re-run a failed release without re-tagging

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims to support in its classifiers.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q
        # This includes tests/test_publishable.py, so a release cannot ship a
        # vocabulary that still carries the private source map, or a fixture
        # that was never scrubbed.

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi        # must match the Trusted Publisher registration
    permissions:
      id-token: write        # mint the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME declares $tag but pyproject.toml says $version"
            exit 1
          fi
          echo "releasing $version"
          # A version number can never be reused on PyPI. Catching a mismatch
          # here costs a re-tag; catching it after upload costs a version.

      - run: uv build

      - name: Artifacts must contain the vocabulary
        run: |
          # The analyzer is inert without its harvested tables, and a packaging
          # change could drop them silently — the wheel would still install and
          # the command would still start.
          python3 - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          vocab = [n for n in names if "/vocabulary/" in n and n.endswith(".yaml")]
          print(f"{wheel}: {len(vocab)} vocabulary files")
          if len(vocab) < 4:
              sys.exit(f"expected the harvested vocabulary in the wheel, found {vocab}")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `with:` block — it detects OIDC from id-token: write, and attaches
        # PEP 740 attestations so an installer can verify these artifacts came
        # from this workflow.
